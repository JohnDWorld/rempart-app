<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplace par `flutter build --base-href` : Rempart est servi a la racine. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Messagerie chiffree de bout en bout, hebergement souverain.">

  <!-- La couleur de la barre du navigateur et de la fenetre installee : le
       bleu marine du logo, pour que l'ouverture ne commence pas par un eclair
       blanc. -->
  <meta name="theme-color" content="#1e3048">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rempart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Le SVG d'abord : un favicon net sur un ecran 4K comme dans un onglet de
       16 points, sans decliner cinq tailles. Le PNG reste pour Safari et les
       vieux navigateurs, qui ignorent le premier. -->
  <link rel="icon" type="image/svg+xml" href="icons/rempart.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Rempart</title>
  <link rel="manifest" href="manifest.json">
  <!-- Sous chaque champ dessiné par Flutter, le navigateur garde un champ
       invisible qui porte le même texte et le vrai curseur, et Flutter lui
       demande la police Inter. Or Flutter ne charge Inter que pour son propre
       dessin : le navigateur se rabattait sur Arial, plus étroite, et son
       curseur prenait du retard à chaque lettre (32 pixels sur 72 caractères).
       Là où ce curseur se voit, il clignotait donc avant le vrai, d'autant
       plus loin que le message était long. Ce sont les fichiers que Flutter
       télécharge déjà : rien de plus ne transite. -->
  <style>
    @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/assets/fonts/Inter-Regular.ttf"); }
    @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/assets/fonts/Inter-Medium.ttf"); }
    @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/assets/fonts/Inter-SemiBold.ttf"); }
    @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/assets/fonts/Inter-Bold.ttf"); }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
